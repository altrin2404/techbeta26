    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/admin' })
                    .then(registration => {
                        console.log('Admin SW registered:', registration);
                    })
                    .catch(error => {
                        console.log('Admin SW registration failed:', error);
                    });
            });
        }
    </script>
